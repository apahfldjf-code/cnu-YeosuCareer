<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여수캠퍼스 진로탐험</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="hud-card"><b id="hud-name"></b><div id="hud-prog"></div><div id="hud-bar"><i id="hud-fill"></i></div><div id="hud-misc"></div></div>
  <div id="hud-right">
    <canvas id="mini" width="340" height="340"></canvas>
    <div class="hud-btns"><button id="b-report">📊 리포트(Tab)</button><button id="b-menu">⏸ 메뉴(Esc)</button></div>
  </div>
  <div id="race-info" class="hidden"></div>
  <div id="countdown"></div>
  <div id="speed" class="hidden"></div>
  <div id="prompt"></div>
  <div id="keys">WASD 이동 · Shift 달리기 · Space 점프 · 마우스 드래그/←→ 시점 · E 상호작용 · F 강하게 차기 · R 공 되돌리기 · M 지도 크기 · F11 전체화면</div>
</div>

<div id="title" class="screen">
  <div class="title-card">
    <h1>🧭 여수캠퍼스 진로탐험</h1>
    <p class="sub">전남대학교 여수캠퍼스 37개 학과(부) 부스에서 직업체험을 하고,<br>나에게 어울리는 전공과 직업군을 찾아보세요!</p>
    <label class="nm">이름 <input id="in-name" maxlength="8" placeholder="탐험가"></label>
    <div class="opt"><span>머리</span><div id="o-style"></div></div>
    <div class="opt"><span>머리색</span><div id="o-hair"></div></div>
    <div class="opt"><span>피부</span><div id="o-skin"></div></div>
    <div class="opt"><span>교복</span><div id="o-uni"></div></div>
    <div class="opt"><span>가방</span><div id="o-bag"></div></div>
    <div class="row"><button id="b-rand" class="btn">🎲 랜덤</button><button id="b-start" class="btn primary big">▶ 탐험 시작</button></div>
    <div id="t-info" class="small"></div>
  </div>
</div>

<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toast"></div>
<div id="loading">불러오는 중…</div>

<script>
window.addEventListener('error', function (e) {
  var l = document.getElementById('loading'); if (!l) return;
  l.style.display = 'flex';
  l.innerHTML = '⚠️ 시작 오류: ' + (e.message || '파일을 불러오지 못했습니다') + '<br><small>터미널에서 npm install 을 먼저 실행했는지 확인하세요. (F12: 오류 확인)</small>';
}, true);
</script>
<script type="module" src="src/game.js"></script>
</body>
</html>
